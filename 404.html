<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script>
        if (typeof window !== 'undefined' && window.location) {
            try {
                var _loc = window.location;
                if (_loc.protocol === 'http:' && _loc.hostname !== 'localhost' && _loc.hostname !== '127.0.0.1') {
                    _loc.replace('https://' + _loc.host + _loc.pathname + _loc.search + _loc.hash);
                }
            } catch (e) { }
        }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="text-scale" content="scale">
    <meta name="robots" content="noindex, follow">
    <title>404: Allocation Not Found | Tixora Live Protocol</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#111113">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="editorial.css?v=5">

    <script src="https://unpkg.com/lucide@latest" defer></script>
</head>

<body class="ops-body ops-shell">

    <header class="ops-topbar"
        style="padding: 12px clamp(16px, 4vw, 32px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;">
        <a href="/" class="brand-mark" aria-label="Tixora Homepage">
            <picture>
                <source srcset="tixora-logo.webp" type="image/webp">
                <img src="tixora-logo.png" alt="Tixora" width="112" height="28">
            </picture>
        </a>
        <a href="/" class="btn-editorial-outline-dark btn-compact">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            <span>Back to Home</span>
        </a>
    </header>

    <main class="ops-auth-main">
        <div class="ops-card max-w-md w-full p-8 text-center space-y-6">
            <div class="ops-subcard"
                style="inline-size: 64px; block-size: 64px; margin-inline: auto; display: inline-flex; align-items: center; justify-content: center; background-color: var(--crimson-bg); border-color: var(--crimson-border); color: var(--crimson-ink);">
                <i data-lucide="shield-alert" class="w-7 h-7"></i>
            </div>

            <div class="space-y-2">
                <div class="eyebrow" style="justify-content: center;">Error 404 &bull; Route Unavailable</div>
                <h1 class="font-bold tracking-tight text-[var(--ink)]"
                    style="font-size: clamp(1.65rem, 1.3rem + 2vw, 2.15rem); line-height: 1.1;">
                    Allocation Not Found
                </h1>
                <p class="text-sm text-[var(--muted)] leading-relaxed pt-1">
                    This page or pass allocation has moved or expired.
                </p>
            </div>

            <div class="flex flex-col sm:flex-row gap-3 justify-center pt-2">
                <a href="/" class="btn-editorial-primary">
                    <i data-lucide="compass" class="w-4 h-4"></i>
                    <span>Explore Tours</span>
                </a>
                <a href="/protocol" class="btn-editorial-outline-light">
                    <i data-lucide="cpu" class="w-4 h-4"></i>
                    <span>Protocol Specs</span>
                </a>
            </div>

            <div class="pt-4 border-t text-xs text-[var(--muted)] font-mono">
                BookMyShow &amp; District Live Partner Network
            </div>
        </div>
    </main>

    <footer
        style="border-block-start: 1px solid var(--line); background-color: var(--bg-base); padding: 20px 24px; text-align: center; font-size: 12px; color: var(--muted);">
        &copy; 2026 Tixora Protocol Technologies Pvt. Ltd. All rights reserved.
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (window.lucide && lucide.createIcons) lucide.createIcons();
        });
    </script>
</body>

</html>
